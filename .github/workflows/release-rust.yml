name: Release Rust generator (librarian)

# Rust has no protoc plugin upstream: google-cloud-rust is generated by
# `librarian` (googleapis/librarian, which absorbed the "sidekick" generator).
# This builds and ships the `librarian` CLI from the gapic-rust submodule.
#
# Unlike release-go.yml this does NOT use GoReleaser: GoReleaser needs a plain
# `vX.Y.Z` tag, and the Go plugin already publishes those (v0.63.0…). librarian
# versions (0.53.x…) would eventually collide, so we release on `rs-v*` directly.

on:
  push:
    tags: ['rs-v*']

permissions:
  contents: write

env:
  GEN_DIR: gapic-rust
  NAME: librarian

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#rs-v}" >>"$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: gapic-rust/go.mod

      - name: Cross-compile
        id: build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/dist"
          mkdir -p "$OUT"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}"
            stage="$RUNNER_TEMP/stage/${NAME}_${VERSION}_${os}_${arch}"
            mkdir -p "$stage"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            (cd "$GEN_DIR" && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "$stage/${NAME}${ext}" ./cmd/librarian)
            cp "$GEN_DIR/LICENSE" "$GEN_DIR/README.md" "$stage/"
            if [ "$os" = "windows" ]; then
              (cd "$stage" && zip -q "$OUT/$(basename "$stage").zip" ./*)
            else
              tar -C "$stage" -czf "$OUT/$(basename "$stage").tar.gz" .
            fi
          done
          (cd "$OUT" && shasum -a 256 * > checksums.txt)
          cat "$OUT/checksums.txt"
          echo "dir=$OUT" >>"$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "librarian (Rust GAPIC) ${VERSION}" \
            --notes "Rust client-library generator, redistributed from googleapis/librarian at upstream version ${VERSION}. This is the generator behind googleapis/google-cloud-rust; it is a CLI driven by librarian.yaml, not a protoc plugin.

          Generating Rust also needs: protoc, cargo, rustfmt, taplo.

          ### Install (Homebrew)
          \`\`\`bash
          brew install the-protobuf-project/tap/librarian
          \`\`\`" \
            "${{ steps.build.outputs.dir }}"/*

      - name: Publish Homebrew formula to tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          DIST: ${{ steps.build.outputs.dir }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          sha() { awk -v f="${NAME}_${VERSION}_$1.tar.gz" '$2==f {print $1}' "$DIST/checksums.txt"; }
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/the-protobuf-project/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/librarian.rb <<EOF
          class Librarian < Formula
            desc "Rust GAPIC client generator (googleapis/librarian)"
            homepage "https://github.com/the-protobuf-project/gapic"
            license "Apache-2.0"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "${BASE}/${NAME}_${VERSION}_darwin_arm64.tar.gz"
                sha256 "$(sha darwin_arm64)"
              end
              on_intel do
                url "${BASE}/${NAME}_${VERSION}_darwin_amd64.tar.gz"
                sha256 "$(sha darwin_amd64)"
              end
            end
            on_linux do
              on_arm do
                url "${BASE}/${NAME}_${VERSION}_linux_arm64.tar.gz"
                sha256 "$(sha linux_arm64)"
              end
              on_intel do
                url "${BASE}/${NAME}_${VERSION}_linux_amd64.tar.gz"
                sha256 "$(sha linux_amd64)"
              end
            end

            def install
              bin.install "librarian"
            end

            test do
              assert_predicate bin/"librarian", :executable?
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/librarian.rb
          git commit -m "librarian ${VERSION}" || { echo "no change"; exit 0; }
          git push
